<!DOCTYPE html>
<html>
<head>
  <title>No Beard Game</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background-color: #222;
    }
    canvas {
      border: 1px solid black;
    }
    #score {
        position: absolute;
        top: 10px;
        left: 10px;
        color: white;
        font-size: 2em;
        font-family: sans-serif;
    }
    #progressBar {
        position: absolute;
        top: 50px;
        left: 10px;
        width: 200px;
        height: 20px;
        border: 1px solid white;
    }
    #progress {
        width: 0%;
        height: 100%;
        background-color: green;
    }
  </style>
</head>
<body>
  <div id="score">Score: 0</div>
  <div id="progressBar">
    <div id="progress"></div>
  </div>
  <video id="video" width="320" height="240" autoplay style="display: none;"></video>
  <canvas id="canvas" width="320" height="240"></canvas>

  <!-- Require the peer dependencies of face-landmarks-detection. -->
  <script src="https://unpkg.com/@tensorflow/tfjs-core@2.4.0/dist/tf-core.js"></script>
  <script src="https://unpkg.com/@tensorflow/tfjs-converter@2.4.0/dist/tf-converter.js"></script>

  <!-- You must explicitly require a TF.js backend if you're not using the tfjs union bundle. -->
  <script src="https://unpkg.com/@tensorflow/tfjs-backend-webgl@2.4.0/dist/tf-backend-webgl.js"></script>

  <!-- Require face-landmarks-detection itself. -->
  <script src="https://unpkg.com/@tensorflow-models/face-landmarks-detection@0.0.1/dist/face-landmarks-detection.js"></script>

  <script src="app.js"></script>
</body>
</html>
